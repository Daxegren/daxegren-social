name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -y && sudo apt-get install -y ffmpeg # the Reel renderer test draws a real video
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
