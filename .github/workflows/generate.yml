name: Generate drafts
# Fill in the form under Actions → "Generate drafts" → Run workflow.
# Creates a brief and one draft per channel; drafts then wait in the review queue.
on:
  workflow_dispatch:
    inputs:
      idea: { description: "What should the content be about?", required: true }
      channels: { description: "Comma separated, e.g. linkedin,instagram", required: true, default: "linkedin,instagram" }
      angle: { description: "Angle (optional)", required: false }
      goal: { description: "Goal (optional)", required: false }
concurrency:
  group: social-worker
  cancel-in-progress: false
jobs:
  generate:
    if: ${{ vars.SOCIAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Inputs go through env vars, never interpolated into the shell command.
      - run: node dist/worker/main.js generate "$IDEA" --channels "$CHANNELS" ${ANGLE:+--angle "$ANGLE"} ${GOAL:+--goal "$GOAL"}
        env:
          IDEA: ${{ inputs.idea }}
          CHANNELS: ${{ inputs.channels }}
          ANGLE: ${{ inputs.angle }}
          GOAL: ${{ inputs.goal }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
