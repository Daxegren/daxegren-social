name: Learn from published posts
# Daily: read what is live on channels that expose it and refresh metrics, so the next
# generation round sees what actually worked.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency:
  group: social-worker
  cancel-in-progress: false
jobs:
  learn:
    if: ${{ vars.SOCIAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - if: ${{ env.INSTAGRAM_USER_ID != '' }}
        run: |
          node dist/worker/main.js ingest instagram
          node dist/worker/main.js refresh-metrics instagram
