name: Memo from text
# Paste or dictate what you want to say (your phone's keyboard microphone works) and get drafts of the points worth
# publishing. No recording and no Drive needed, so it is the quickest way to try the voice-memo flow.
on:
  workflow_dispatch:
    inputs:
      text: { description: "What you said or want to say (at least a few sentences)", required: true }
      name: { description: "A label for it (optional)", required: false }
concurrency:
  group: social-worker
  cancel-in-progress: false
jobs:
  memo:
    if: ${{ vars.SOCIAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Inputs go through env vars, never interpolated into the shell command.
      - run: node dist/worker/main.js memo --text "$MEMO_TEXT" ${MEMO_NAME:+--name "$MEMO_NAME"}
        env:
          MEMO_TEXT: ${{ inputs.text }}
          MEMO_NAME: ${{ inputs.name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          MEMO_CHANNELS: ${{ vars.MEMO_CHANNELS }}
          MEMO_MAX_IDEAS: ${{ vars.MEMO_MAX_IDEAS }}
          CAROUSEL_HANDLE: ${{ vars.CAROUSEL_HANDLE }}
          CAROUSEL_ACCENT: ${{ vars.CAROUSEL_ACCENT }}
          CAROUSEL_THEME: ${{ vars.CAROUSEL_THEME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOCIAL_MEDIA_BUCKET: ${{ vars.SOCIAL_MEDIA_BUCKET }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNELS: ${{ vars.BUFFER_CHANNELS }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          APP_URL: ${{ vars.APP_URL }}
